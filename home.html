
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090914">
<title>Explore — NOVA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#090914;--panel:#131326;--text:#f6f4ff;--muted:#a4a2bc;--purple:#c4b5fd;--cyan:#67e8f9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}button,input{font:inherit}
.container{width:min(1100px,90%);margin:auto}
nav{height:80px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff12;position:relative;z-index:2}
.logo{font:700 27px 'Space Grotesk';letter-spacing:2px}.logo span{color:var(--purple)}
.navlinks{display:flex;gap:30px;align-items:center}
.navlinks a{color:var(--muted);font-size:14px}.navlinks a:hover,.navlinks .active{color:white}
.navlinks .pill{border:1px solid #ffffff25;border-radius:30px;padding:11px 18px;color:white}
.menu-btn{display:none;color:white;background:none;border:0;font-size:26px}
.hero{padding:85px 0 45px;position:relative}
.hero:before{content:"";position:absolute;z-index:-1;top:10px;left:20%;width:380px;height:230px;background:#7c3aed28;filter:blur(100px)}
.eyebrow{color:var(--purple);font-size:12px;letter-spacing:2px;text-transform:uppercase}
h1{font:700 clamp(42px,6vw,68px)/1.12 'Space Grotesk';letter-spacing:-2.5px;margin:18px 0}
.gradient{background:linear-gradient(100deg,#c4b5fd,#67e8f9);background-clip:text;color:transparent}
.hero p{color:var(--muted);line-height:1.8;max-width:550px}
.searchbar{margin-top:32px;display:flex;gap:12px;max-width:650px}
.searchbar input{flex:1;min-width:0;background:#151528;border:1px solid #ffffff19;border-radius:12px;padding:16px;color:white;outline:none}
.searchbar input:focus{border-color:#a78bfa}
.searchbar button{background:linear-gradient(120deg,#c4b5fd,#67e8f9);color:#100c20;border:0;border-radius:12px;padding:0 24px;font-weight:700;cursor:pointer}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 36px}
.filter{padding:10px 17px;border:1px solid #ffffff18;border-radius:30px;background:transparent;color:var(--muted);cursor:pointer;transition:.2s;font-size:13px}
.filter.active,.filter:hover{background:#c4b5fd;color:#100c20;border-color:#c4b5fd}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:15px}
h2{font:600 27px 'Space Grotesk'}
.count{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:85px}
.card{border:1px solid #ffffff13;border-radius:19px;background:linear-gradient(145deg,#16162b,#10101d);padding:25px;display:flex;flex-direction:column;min-height:255px;transition:.3s}
.card:hover{transform:translateY(-5px);border-color:#a78bfa66}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}
.icon{width:47px;height:47px;border-radius:14px;background:#a78bfa16;border:1px solid #a78bfa29;display:grid;place-items:center;font-size:22px}
.tag{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--cyan)}
.card h3{font:600 20px 'Space Grotesk';margin-bottom:10px}
.card p{font-size:13px;color:var(--muted);line-height:1.8;flex:1}
.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:23px}
.read{font-size:13px;color:var(--purple);background:none;border:0;cursor:pointer}
.save{border:1px solid #ffffff20;border-radius:9px;background:transparent;color:white;padding:8px 10px;cursor:pointer}
.save.saved{background:#c4b5fd;color:#100c20}
.empty{grid-column:1/-1;text-align:center;padding:55px 10px;color:var(--muted);border:1px dashed #ffffff25;border-radius:18px}
footer{border-top:1px solid #ffffff12;padding:27px 0;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:12px}
footer a{color:var(--purple)}
.modal{display:none;position:fixed;inset:0;background:#05050bdc;z-index:10;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{max-width:500px;width:100%;padding:30px;background:#17172b;border:1px solid #ffffff24;border-radius:20px}
.modal-box h2{margin-bottom:15px}.modal-box p{color:var(--muted);line-height:1.9}
.modal-actions{display:flex;gap:10px;margin-top:25px}
.modal-actions button,.modal-actions a{border:1px solid #ffffff25;border-radius:10px;padding:11px 15px;background:#ffffff08;color:white;cursor:pointer}
.modal-actions a{background:#c4b5fd;color:#100c20}
@media(max-width:760px){
 .grid{grid-template-columns:1fr 1fr}
 .navlinks{display:none;position:absolute;top:72px;left:0;right:0;background:#131326;padding:23px;border:1px solid #ffffff20;border-radius:14px;flex-direction:column;align-items:stretch;gap:20px}
 .navlinks.open{display:flex}.menu-btn{display:block}
 .hero{padding-top:65px}
}
@media(max-width:520px){.grid{grid-template-columns:1fr}.searchbar button{padding:0 15px}.section-head{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="container">
<nav>
<a href="index.html" class="logo">NO<span>V</span>A.</a>
<button class="menu-btn" id="menuBtn" aria-label="Toggle navigation" aria-expanded="false">☰</button>
<div class="navlinks" id="navlinks">
<a href="index.html">Overview</a>
<a href="home.html" class="active">Home</a>
<a href="index.html#discover">Discover</a>
<a href="contact.html" class="pill">Contact ↗</a>
</div>
</nav>
</header>

<main class="container">
<section class="hero">
<div class="eyebrow">The discovery space</div>
<h1>A universe of<br><span class="gradient">possibilities.</span></h1>
<p>Ideas worth exploring. Concepts worth questioning. Find your next spark of inspiration in our digital discovery space.</p>
<form class="searchbar" id="searchForm">
<input id="searchInput" type="search" placeholder="Search ideas, technology, creativity..." aria-label="Search ideas">
<button type="submit">Search ↗</button>
</form>
</section>

<div class="filters" id="filters" aria-label="Filter categories">
<button class="filter active" data-filter="all">All discoveries</button>
<button class="filter" data-filter="creativity">Creativity</button>
<button class="filter" data-filter="technology">Technology</button>
<button class="filter" data-filter="mind">Mind &amp; life</button>
</div>

<section>
<div class="section-head">
<h2>Explore something new</h2>
<span class="count" id="count" aria-live="polite"></span>
</div>
<div class="grid" id="grid"></div>
</section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="modal-box">
<div class="eyebrow" id="modalCategory">DISCOVERY</div>
<h2 id="modalTitle"></h2>
<p id="modalText"></p>
<div class="modal-actions">
<button id="closeModal">Close</button>
<a href="contact.html">Discuss this idea ↗</a>
</div>
</div>
</div>

<footer class="container">
<a class="logo" href="index.html">NO<span>V</span>A.</a>
<span>© <span id="year"></span> NOVA Studio</span>
<a href="contact.html">Let's connect ↗</a>
</footer>

<script>
const discoveries = [
 {id:1,title:"The Creative Lab",category:"creativity",icon:"✳",description:"A playground for original ideas, design experiments and creative thinking.",detail:"Try a daily creative challenge: invent a product for an unusual problem, sketch a new interface, or combine two unrelated ideas into one. Creativity grows when you experiment."},
 {id:2,title:"AI & Tomorrow",category:"technology",icon:"⌘",description:"Explore how artificial intelligence is changing the way we learn and create.",detail:"AI can help with brainstorming, research and repetitive tasks. Start with a small project, check important facts, protect private information and keep human judgment at the centre."},
 {id:3,title:"Mindful Moments",category:"mind",icon:"◈",description:"Small habits and thoughtful prompts for a clearer, more intentional day.",detail:"Take a quiet five-minute break. Write down one priority, one thing you learned and one small step you can take today. Simple reflection can help you organise your thoughts."},
 {id:4,title:"Design Thinking",category:"creativity",icon:"◇",description:"Turn everyday problems into opportunities through observation and experimentation.",detail:"Understand the person facing the problem, define the real challenge, brainstorm options, create a simple prototype and test it. Learn from feedback before investing more effort."},
 {id:5,title:"The Future Web",category:"technology",icon:"◎",description:"Discover accessible, responsive and interactive experiences for the modern web.",detail:"A strong website combines responsive layouts, readable contrast, accessible controls, fast-loading assets and meaningful interactions. Start with HTML, CSS and JavaScript, then improve with real user feedback."},
 {id:6,title:"Curiosity Journal",category:"mind",icon:"✧",description:"Collect questions, capture discoveries and turn learning into a daily ritual.",detail:"Keep a list of questions that interest you. Choose one, explore reliable sources, summarise what you learned in your own words and record the next question it raises."},
 {id:7,title:"Colour & Emotion",category:"creativity",icon:"◉",description:"Explore how colour, typography and visual rhythm shape digital experiences.",detail:"Choose one dominant colour, one accent and a neutral background. Keep typography consistent and check contrast. A clear visual hierarchy helps people understand a page at a glance."},
 {id:8,title:"Cyber Smart",category:"technology",icon:"⬡",description:"Build better digital habits and learn the basics of online safety.",detail:"Use unique passwords, enable multi-factor authentication, update your devices and verify unexpected links. Never share passwords or one-time verification codes with strangers."},
 {id:9,title:"Focus Mode",category:"mind",icon:"◌",description:"Create a simple routine to protect your attention and make progress.",detail:"Pick one achievable task, silence non-essential notifications and work for a short, defined interval. Take a break afterwards and decide on the next small step."}
];

const grid = document.getElementById('grid');
const input = document.getElementById('searchInput');
const count = document.getElementById('count');
let activeFilter = 'all';
let query = '';
let saved = new Set();

const icons = {creativity:'CREATIVITY',technology:'TECHNOLOGY',mind:'MIND & LIFE'};
const esc = value => String(value).replace(/[&<>"']/g, ch => ({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
})[ch]);

function render() {
 const items = discoveries.filter(item => {
   const matchesCategory = activeFilter === 'all' || item.category === activeFilter;
   const matchesQuery = (item.title + ' ' + item.description + ' ' + item.category)
     .toLowerCase().includes(query.toLowerCase());
   return matchesCategory && matchesQuery;
 });
 count.textContent = `${items.length} ${items.length === 1 ? 'discovery' : 'discoveries'}`;

 if (!items.length) {
   grid.innerHTML = '<div class="empty">No discoveries found. Try another keyword or category.</div>';
   return;
 }

 grid.innerHTML = items.map(item => `
  <article class="card">
   <div class="card-top">
    <div class="icon">${item.icon}</div>
    <span class="tag">${icons[item.category]}</span>
   </div>
   <h3>${esc(item.title)}</h3>
   <p>${esc(item.description)}</p>
   <div class="card-bottom">
    <button class="read" data-read="${item.id}">Discover more ↗</button>
    <button class="save ${saved.has(item.id) ? 'saved' : ''}" data-save="${item.id}" aria-pressed="${saved.has(item.id)}" aria-label="${saved.has(item.id) ? 'Remove bookmark' : 'Bookmark'} ${esc(item.title)}">${saved.has(item.id) ? '♥ Saved' : '♡ Save'}</button>
   </div>
  </article>`).join('');
}

document.getElementById('searchForm').addEventListener('submit', e => {
 e.preventDefault();
 query = input.value.trim();
 render();
});

input.addEventListener('input', () => {
 query = input.value.trim();
 render();
});

document.getElementById('filters').addEventListener('click', e => {
 const button = e.target.closest('[data-filter]');
 if (!button) return;
 activeFilter = button.dataset.filter;
 document.querySelectorAll('.filter').forEach(el => el.classList.toggle('active', el === button));
 render();
});

grid.addEventListener('click', e => {
 const saveButton = e.target.closest('[data-save]');
 const readButton = e.target.closest('[data-read]');

 if (saveButton) {
   const id = Number(saveButton.dataset.save);
   saved.has(id) ? saved.delete(id) : saved.add(id);
   render();
 }
 if (readButton) {
   const item = discoveries.find(d => d.id === Number(readButton.dataset.read));
   if (!item) return;
   document.getElementById('modalCategory').textContent = icons[item.category];
   document.getElementById('modalTitle').textContent = item.title;
   document.getElementById('modalText').textContent = item.detail;
   document.getElementById('modal').classList.add('open');
   document.getElementById('closeModal').focus();
 }
});

const modal = document.getElementById('modal');
function closeModal() {
 modal.classList.remove('open');
}
document.getElementById('closeModal').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const menuBtn = document.getElementById('menuBtn');
const navlinks = document.getElementById('navlinks');
menuBtn.addEventListener('click', () => {
 const opened = navlinks.classList.toggle('open');
 menuBtn.textContent = opened ? '✕' : '☰';
 menuBtn.setAttribute('aria-expanded', opened);
});
navlinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
 navlinks.classList.remove('open');
 menuBtn.textContent = '☰';
 menuBtn.setAttribute('aria-expanded', 'false');
}));

document.getElementById('year').textContent = new Date().getFullYear();

// Optional category selection from the landing page URL.
const requestedCategory = new URLSearchParams(location.search).get('category');
if (['creativity','technology','mind'].includes(requestedCategory)) {
 activeFilter = requestedCategory;
 document.querySelectorAll('.filter').forEach(el => {
   el.classList.toggle('active', el.dataset.filter === activeFilter);
 });
}
render();
</script>
</body>
</html>
